
name: Update GitHub Contributions

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update contributions JSON
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python python/update_contributions.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/github-contributions.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub contributions"
            git push
          else
            echo "No contribution changes detected."
          fi